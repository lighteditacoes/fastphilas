{% extends "base.html" %}

{% block titulo %}FastPhilas{% endblock %}

{% block conteudo %}

<a href="{{ url_for('usuario.home') }}"><button>Tela inicial</button></a>

<form action="{{ url_for('usuario.cadastro') }}" method="post">
        <label for="nome">Nome</label>
        <input name="nome" type="text" minlength="15" maxlength="50">
        <label for="cpf">CPF (Apenas Números)</label>
        <input name="cpf" type="text" minlength="11" maxlength="11">
        <label for="telefone">Telefone (Apenas Números)</label>
        <input name="telefone" type="number" minlength="11" maxlength="11">
        <label for="email">E-mail</label>
        <input name="email" type="text" minlength="15" maxlength="100">
        <label for="senha">Senha</label>
        <input name="senha" type="password" minlength="10" maxlength="30">
        <select name="preferencial">
            <option value="nao">Não</option>
            <option value="sim">Gestante</option>
            <option value="sim">Idoso (60+)</option>
        </select>
        <select name="funcao">
            <option value="cliente">Cliente</option>
            <option value="administrador">Administrador</option>
        </select>
        <button type="submit">Cadastrar</button>
</form>

<p>Já tem uma conta?</p>
<a href="{{ url_for('usuario.login') }}">Faça login.</a>

{% if erro %}
    <p>Erro: {{erro}}</p>
{% endif %}

{% endblock %}
