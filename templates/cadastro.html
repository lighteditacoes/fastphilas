{% extends "base.html" %}

{% block titulo %}Cadastro{% endblock %}

{% block conteudo %}

<div class="acoes">
    <a href="{{ url_for('usuario.home') }}"><button type="button" class="secundario">Tela inicial</button></a>
</div>

<div class="card">
    <form action="{{ url_for('usuario.cadastro') }}" method="post">
        <div class="campo">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" minlength="15" maxlength="50">
        </div>
        <div class="campo">
            <label for="cpf">CPF (Apenas Números)</label>
            <input id="cpf" name="cpf" type="text" minlength="11" maxlength="11">
        </div>
        <div class="campo">
            <label for="telefone">Telefone (Apenas Números)</label>
            <input id="telefone" name="telefone" type="number" minlength="11" maxlength="11">
        </div>
        <div class="campo">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="text" minlength="15" maxlength="100">
        </div>
        <div class="campo">
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" minlength="10" maxlength="30">
        </div>
        <div class="campo">
            <label for="preferencial">Atendimento preferencial</label>
            <select id="preferencial" name="preferencial">
                <option value="nao">Não</option>
                <option value="sim">Gestante</option>
                <option value="sim">Idoso (60+)</option>
            </select>
        </div>
        <div class="campo">
            <label for="funcao">Função</label>
            <select id="funcao" name="funcao">
                <option value="cliente">Cliente</option>
                <option value="administrador">Administrador</option>
            </select>
        </div>
        <button type="submit" class="cheio">Cadastrar</button>
    </form>

    {% if erro %}
        <p class="erro">Erro: {{erro}}</p>
    {% endif %}
</div>

<div class="rodape-form">
    <p>Já tem uma conta?</p>
    <a href="{{ url_for('usuario.login') }}">Faça login.</a>
</div>

{% endblock %}
