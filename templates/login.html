{% extends "base.html" %}

{% block titulo %}Login{% endblock titulo %}

{% block conteudo %}

<form action="{{url_for('usuario.login')}}" method="post">
    <label for="cpf">CPF</label>
    <input type="text" name="cpf" placeholder="Digite seu CPF: " minlength="11" maxlength="11">
    <label for="senha">Senha</label>
    <input name="senha" type="password" minlength="10" maxlength="30">
    <button type="submit">Entrar</button>
</form>

{% if erro %}
    <p>Erro: {{erro}}</p>
{% endif %}

{% endblock conteudo %}
