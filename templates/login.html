{% extends "base.html" %}

{% block titulo %}Login{% endblock titulo %}

{% block conteudo %}

<div class="acoes">
    <a href="{{ url_for('usuario.home') }}"><button type="button" class="secundario">Tela inicial</button></a>
</div>

<div class="card">
    <form action="{{url_for('usuario.login')}}" method="post">
        <div class="campo">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" minlength="11" maxlength="11">
        </div>
        <div class="campo">
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" minlength="10" maxlength="30">
        </div>
        <button type="submit" class="cheio">Entrar</button>
    </form>

    {% if erro %}
        <p class="erro">Erro: {{erro}}</p>
    {% endif %}
</div>

<div class="rodape-form">
    <p>Ainda não tem uma conta?</p>
    <a href="{{ url_for('usuario.cadastro') }}"><button type="button" class="secundario">Cadastre-se</button></a>
</div>

{% endblock conteudo %}
