{% extends "base.html" %}

{% block titulo %}Editar dados{% endblock %}

{% block conteudo %}

<div class="acoes">
    <a href="{{ url_for('usuario.dashboard') }}"><button type="button" class="secundario">Voltar ao dashboard</button></a>
</div>

<div class="card">
    <form action="{{ url_for('usuario.editar', uuid=usuario.uuid_usuario) }}" method="post">
        <div class="campo">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" value="{{usuario.nome}}" type="text" minlength="15" maxlength="50">
        </div>
        <div class="campo">
            <label for="telefone">Telefone (Apenas Números)</label>
            <input id="telefone" name="telefone" value="{{usuario.telefone}}" type="number" minlength="11" maxlength="11">
        </div>
        <div class="campo">
            <label for="email">E-mail</label>
            <input id="email" name="email" value="{{usuario.email}}" type="text" minlength="15" maxlength="100">
        </div>
        <div class="campo">
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" minlength="10" maxlength="30">
        </div>
        <div class="campo">
            <label for="preferencial">Atendimento preferencial</label>
            <select id="preferencial" name="preferencial">
                <option value="nao">Não</option>
                <option value="sim">Gestante</option>
                <option value="sim">Idoso (60+)</option>
            </select>
        </div>
        <button type="submit" class="cheio">Salvar</button>
    </form>

    {% if erro %}
        <p class="erro">Erro: {{erro}}</p>
    {% endif %}
</div>

{% endblock %}
