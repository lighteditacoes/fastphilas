{% extends "base.html" %}

{% block titulo %}FastPhilas{% endblock %}

{% block conteudo %}

<a href="{{ url_for('usuario.dashboard') }}"><button>Voltar ao dashboard</button></a>

<form action="{{ url_for('usuario.editar', uuid=usuario.uuid_usuario) }}" method="post">
        <label for="nome">Nome</label>
        <input name="nome" value="{{usuario.nome}}" type="text" minlength="15" maxlength="50">
        <label for="telefone">Telefone (Apenas Números)</label>
        <input name="telefone" value="{{usuario.telefone}}" type="number" minlength="11" maxlength="11">
        <label for="email">E-mail</label>
        <input name="email" value="{{usuario.email}}" type="text" minlength="15" maxlength="100">
        <label for="senha">Senha</label>
        <input name="senha" type="password" minlength="10" maxlength="30">
        <select name="preferencial">
            <option value="nao">Não</option>
            <option value="sim">Gestante</option>
            <option value="sim">Idoso (60+)</option>
        </select>
        <button type="submit">Cadastrar</button>
</form>

{% if erro %}
    <p>Erro: {{erro}}</p>
{% endif %}

{% endblock %}
